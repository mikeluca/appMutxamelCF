name: app_mutxamel_cf
description: Aplicación móvil oficial del Mutxamel Club de Fútbol.
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  package_info_plus: ^8.1.2
  webview_flutter: ^4.13.0
  intl: ^0.20.2
  table_calendar: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Usado en tests para sustituir el backend de flutter_secure_storage
  # por el fake en memoria que el propio paquete distribuye
  # (package:flutter_secure_storage/test/test_flutter_secure_storage_platform.dart).
  flutter_secure_storage_platform_interface: ^1.1.2
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/escudo.png
    - assets/images/patrocinador_ayto.png
    - assets/images/patrocinador_frutas.png
    - assets/images/patrocinador_ud.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/escudo_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  
flutter_native_splash:
  color: "#1976B8"
  image: assets/images/escudo.png
  android_12:
    color: "#1976B8"
    image: assets/images/escudo_splash_android12.png