name: app_mutxamel_cf
description: Aplicación móvil oficial del Mutxamel Club de Fútbol.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/escudo.png
    - assets/images/patrocinador_ayto.png
    - assets/images/patrocinador_frutas.png
    - assets/images/patrocinador_ud.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/escudo_icon.png"
  min_sdk_android: 21