name: app_mutxamel_cf
description: Aplicación móvil oficial del Mutxamel Club de Fútbol.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/escudo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/escudo_icon.png"
  min_sdk_android: 21